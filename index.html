<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="description" content="I am creating a social media webpage that adds or removes photos
            and can also make adjustments to a users profile "/><meta name="author" content="Mark Santiago"/><meta name="keywords" content="profile, cards"/><link rel="shortcut icon" href="favicon.ico" type="image/x-icon"/><title>Spots</title><script defer="defer" src="/main.js"></script><link href="/main.css" rel="stylesheet"></head><body><div class="page"><header class="header"><img src="/ce1b93020621958c5ad4.svg" alt="Spots logo" class="header__logo"/></header><main class="content"><section class="profile page__section"><img src="/2fc47fd8e9a9bcd9612f.jpg" alt="picture of Bessie Coleman" class="profile__avitar"/><div class="profile__column"><h1 class="profile__name">Bessie Coleman</h1><p class="profile__description">Civil Aviator</p><button type="button" class="profile__edit-button"><img src="/49e44e5e03758262e8bf.svg" alt="pencil icon"/> Edit Profile</button></div><button type="button" class="profile__new-post"><img src="/975792ea68af0a3c209d.svg" alt="plus logo"/> New Post</button></section><section class="cards"><ul class="cards__list"><template id="card-template"><li class="card"><button type="button" class="card__delete-button"></button> <img class="card__image" alt=""/><div class="card__content"><h2 class="card__description"></h2><button type="button" class="card__like-button"></button></div></li></template></ul></section></main><footer class="footer page__section"><p class="footer__copyright">2023 © Spots</p></footer><div class="modal" id="edit-profile-modal"><div class="modal__container"><button type="button" class="modal__close-button"><img src="/077de99f47bea9909684.svg" alt="X button"/></button><h2 class="modal__title">Edit Profile</h2><form class="modal__form" id="edit-profile-form" novalidate><label for="profile-name-input" class="modal__label">Name <input id="profile-name-input" name="name" class="modal__input" placeholder="Type your name" minlength="2" maxlength="40" required/> <span id="profile-name-input-error" class="modal__error"></span></label> <label for="profile-description-input" class="modal__label">Description <input id="profile-description-input" name="description" class="modal__input" placeholder="Describe yourself" minlength="2" maxlength="200" required/> <span id="profile-description-input-error" class="modal__error"></span></label> <button type="submit" class="modal__save">Save</button></form></div></div><div class="modal" id="new-post-modal"><div class="modal__container"><button type="button" class="modal__close-button"><img src="/077de99f47bea9909684.svg" alt="X button"/></button><h2 class="modal__title">New Post</h2><form class="modal__form" id="new-post-form" novalidate><label for="card-image-input" class="modal__label">Image link <input id="card-image-input" name="description" type="url" class="modal__input" placeholder="Paste a link to the picture" required/> <span id="card-image-input-error" class="modal__error"></span></label> <label for="card-caption-input" class="modal__label">Caption <input id="card-caption-input" name="caption" class="modal__input" placeholder="Type your caption" minlength="2" maxlength="30" required/> <span id="card-caption-input-error" class="modal__error"></span></label> <button type="submit" class="modal__save">Save</button></form></div></div></div><div class="modal modal_type_preview" id="preview-modal"><div class="modal__image-container"><button type="button" class="modal__close-button modal__close-button_type_preview"><img src="/2a6d443422ae27e8b633.svg" alt="X button"/></button> <img src="#" alt="" class="modal__image"/><p class="modal__caption"></p></div></div></body></html>
